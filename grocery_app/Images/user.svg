<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <style>
    /* Raised arm waves from the shoulder */
    #arm {
      transform-origin: 122px 200px;
      animation: wave 1.6s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(14deg); }
      40%      { transform: rotate(-4deg); }
      60%      { transform: rotate(14deg); }
      80%      { transform: rotate(-2deg); }
    }
    /* Gentle body bounce */
    #person {
      transform-origin: 150px 360px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    /* Blink */
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #arm, #person, .eye { animation: none; }
    }
  </style>

  <!-- ground shadow -->
  <ellipse cx="150" cy="362" rx="52" ry="8" fill="#000" opacity="0.12"/>

  <g id="person">
    <!-- slight playful lean -->
    <g>

      <!-- trousers: wide stance -->
      <path d="M140 294 L137 346" fill="none" stroke="#1B1D22" stroke-width="19" stroke-linecap="round"/>
      <path d="M160 294 L163 346" fill="none" stroke="#1B1D22" stroke-width="19" stroke-linecap="round"/>
      <path d="M150 296 L150 304" stroke="#1B1D22" stroke-width="20"/>
      <path d="M139 304 L137 338 M161 304 L163 338" fill="none" stroke="#2C2F37" stroke-width="2" stroke-linecap="round"/>

      <!-- polished black shoes -->
      <path d="M146 352 Q146 342 136 342 Q122 342 115 350 L115 356 L146 356 Z" fill="#141519"/>
      <path d="M154 352 Q154 342 164 342 Q178 342 185 350 L185 356 L154 356 Z" fill="#141519"/>
      <path d="M122 347 Q128 344 134 345 M166 345 Q172 344 178 347" fill="none" stroke="#5A5E69" stroke-width="2" stroke-linecap="round"/>

      <!-- suit jacket -->
      <path d="M116 196 Q150 184 184 196 L190 302 Q150 308 110 302 Z" fill="#22252B"/>
      <!-- white shirt -->
      <path d="M138 192 L162 192 L160 292 L140 292 Z" fill="#F7F7F4"/>
      <path d="M150 210 L150 280" stroke="#D9D9D3" stroke-width="1.5" stroke-dasharray="1 8" stroke-linecap="round"/>
      <!-- lapels -->
      <path d="M138 192 L126 198 L143 250 Z" fill="#2E323A"/>
      <path d="M162 192 L174 198 L157 250 Z" fill="#2E323A"/>
      <path d="M138 192 L143 250 M162 192 L157 250" stroke="#16181C" stroke-width="2"/>
      <!-- jacket buttons -->
      <circle cx="141" cy="270" r="2.5" fill="#3A3E47"/>
      <!-- pocket square -->
      <path d="M164 222 L178 222 L176 228 L166 228 Z" fill="#3A3E47"/>
      <path d="M167 222 L170 216 L173 222 Z" fill="#B49BDB"/>
      <!-- belt -->
      <rect x="140" y="284" width="20" height="7" fill="#141519"/>
      <rect x="147" y="284" width="7" height="7" rx="1" fill="none" stroke="#C9CDD6" stroke-width="1.5"/>

      <!-- neck and collar -->
      <rect x="141" y="160" width="18" height="30" rx="7" fill="#B87B4E"/>
      <path d="M140 184 L136 197 L149 194 Z" fill="#FFFFFF" stroke="#D9D9D3" stroke-width="1"/>
      <path d="M160 184 L164 197 L151 194 Z" fill="#FFFFFF" stroke="#D9D9D3" stroke-width="1"/>

      <!-- purple striped tie -->
      <path d="M146 192 L154 192 L153 200 L147 200 Z" fill="#7A57AE"/>
      <path d="M147 200 L153 200 L157 266 L150 276 L143 266 Z" fill="#8E6BBF"/>
      <path d="M146 214 L154 208 M145 228 L156 220 M144 242 L156 234 M144 256 L157 247 M146 268 L156 260"
            stroke="#B49BDB" stroke-width="2" stroke-linecap="round"/>

      <!-- hand-on-hip arm (in front of jacket) -->
      <path d="M180 200 Q212 234 200 262 Q194 276 188 284" fill="none" stroke="#22252B" stroke-width="18" stroke-linecap="round"/>
      <path d="M196 222 Q206 238 202 254" fill="none" stroke="#353943" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M189 280 L186 288" stroke="#F7F7F4" stroke-width="16"/>
      <ellipse cx="184" cy="294" rx="9" ry="11" fill="#C68A5B"/>

      <!-- head -->
      <circle cx="150" cy="118" r="54" fill="#C68A5B"/>
      <circle cx="97" cy="122" r="11" fill="#B87B4E"/>
      <circle cx="203" cy="122" r="11" fill="#B87B4E"/>
      <!-- modern pompadour with faded sides -->
      <path d="M97 116 Q95 92 104 80 L108 112 Z" fill="#3B332D" opacity="0.85"/>
      <path d="M203 116 Q205 92 196 80 L192 112 Z" fill="#3B332D" opacity="0.85"/>
      <path d="M104 96 Q94 44 120 28 Q146 12 178 20 Q206 32 202 96 Q196 78 178 74 Q150 70 124 78 Q110 84 104 96 Z" fill="#1F1A17"/>
      <path d="M106 70 Q106 24 152 18 Q190 16 202 46 Q180 32 152 36 Q122 42 106 70 Z" fill="#2A231F"/>
      <path d="M116 46 Q144 20 186 30" fill="none" stroke="#4A3F37" stroke-width="3" stroke-linecap="round"/>
      <path d="M124 58 Q154 38 194 48" fill="none" stroke="#4A3F37" stroke-width="2" stroke-linecap="round"/>

      <!-- eyebrows -->
      <path d="M116 98 Q128 91 140 97" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
      <path d="M160 97 Q172 91 184 98" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
      <!-- sunglasses -->
      <path d="M110 106 L146 106 Q147 123 138 130 L118 130 Q109 123 110 106 Z" fill="#14161B" stroke="#0B0C0F" stroke-width="2.5"/>
      <path d="M154 106 L190 106 Q191 123 182 130 L162 130 Q153 123 154 106 Z" fill="#14161B" stroke="#0B0C0F" stroke-width="2.5"/>
      <path d="M146 110 Q150 106 154 110" fill="none" stroke="#0B0C0F" stroke-width="3"/>
      <path d="M110 108 L99 114 M190 108 L201 114" stroke="#0B0C0F" stroke-width="3" stroke-linecap="round"/>
      <path d="M116 112 L126 112 M160 112 L170 112" stroke="#8FA6C4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M118 118 L122 118 M162 118 L166 118" stroke="#8FA6C4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- cheeks -->
      <ellipse cx="116" cy="138" rx="9" ry="5" fill="#E07A5F" opacity="0.45"/>
      <ellipse cx="184" cy="138" rx="9" ry="5" fill="#E07A5F" opacity="0.45"/>
      <!-- smile -->
      <path d="M130 140 Q150 162 170 140 Q150 150 130 140 Z" fill="#7A2E22"/>
      <path d="M134 141 Q150 148 166 141" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

      <!-- raised waving arm: out to the side, then up -->
      <g id="arm">
        <path d="M122 202 Q78 200 68 152" fill="none" stroke="#22252B" stroke-width="18" stroke-linecap="round"/>
        <path d="M100 192 Q82 184 76 168" fill="none" stroke="#353943" stroke-width="2.5" stroke-linecap="round"/>
        <!-- white shirt cuff -->
        <path d="M67 148 L65 138" stroke="#F7F7F4" stroke-width="17"/>
        <!-- wrist -->
        <path d="M65 138 Q64 130 64 122" fill="none" stroke="#C68A5B" stroke-width="12" stroke-linecap="round"/>
        <!-- open hand (mirrored) -->
        <g fill="#C68A5B" transform="translate(302 0) scale(-1 1)">
          <ellipse cx="240" cy="104" rx="17" ry="19"/>
          <rect x="226" y="72" width="7" height="24" rx="3.5" transform="rotate(-12 229 84)"/>
          <rect x="235" y="66" width="7" height="28" rx="3.5" transform="rotate(-4 238 80)"/>
          <rect x="244" y="68" width="7" height="27" rx="3.5" transform="rotate(5 247 81)"/>
          <rect x="252" y="76" width="7" height="22" rx="3.5" transform="rotate(14 255 87)"/>
          <rect x="216" y="98" width="20" height="8" rx="4" transform="rotate(-35 226 102)"/>
        </g>
        <!-- motion lines -->
        <path d="M34 80 Q24 96 32 114" fill="none" stroke="#8E6BBF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
        <path d="M90 62 Q80 52 66 52" fill="none" stroke="#8E6BBF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
